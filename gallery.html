<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 3 - Image Gallery</title>
    <link rel="stylesheet" href="flex-grid.css">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .gallery-item {
            position: relative;
            background: #ccc;
        }

        .gallery-item img {
            width: 100%;
            display: block;
        }

        .caption {
            position: absolute;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            width: 100%;
            text-align: center;
            padding: 5px 0;
            display: none;
        }

        .gallery-item:hover .caption {
            display: block;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">My Project</div>
    <ul class="nav-links">
        <li><a href="flex-cards.html">Task 1</a></li>
        <li><a href="grid-layout.html">Task 2</a></li>
        <li><a href="gallery.html">Task 3</a></li>
        <li><a href="portfolio.html">Task 4</a></li>
    </ul>
</div>

<div class="container">
    <h1>Task 3: Image Gallery</h1>
    <div class="gallery">
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=1"><div class="caption">Image 1</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=2"><div class="caption">Image 2</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=3"><div class="caption">Image 3</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=4"><div class="caption">Image 4</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=5"><div class="caption">Image 5</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=6"><div class="caption">Image 6</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=7"><div class="caption">Image 7</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=8"><div class="caption">Image 8</div></div>
        <div class="gallery-item"><img src="https://picsum.photos/300/200?random=9"><div class="caption">Image 9</div></div>
    </div>
</div>

</body>
</html>
